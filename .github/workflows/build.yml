name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run offline tests
        run: python -m unittest -v test_start_instance.py test_gui.py test_credential_store.py
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build executable and packages
        run: python build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: CompShareStart-windows-x64
          path: release/*
          if-no-files-found: error
